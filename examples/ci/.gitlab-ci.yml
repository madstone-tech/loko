# Validate a loko architecture and build its site.
#
# Copy to .gitlab-ci.yml and set LOKO_PROJECT to the directory holding your
# *.loko.hcl files. The release image is distroless (no shell), so this job
# installs loko with Go instead.

variables:
  LOKO_PROJECT: architecture

architecture:
  image: golang:1.27
  before_script:
    - go install github.com/madstone-tech/loko@latest
  script:
    - loko validate --strict -p "$LOKO_PROJECT"
    - loko fmt --check -p "$LOKO_PROJECT"
    - loko build -p "$LOKO_PROJECT" --out site
  artifacts:
    paths:
      - site
    expire_in: 2 weeks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
