# Run loko from the release image, without installing it.
#
# Copy next to your *.loko.hcl files (or set LOKO_PROJECT to their directory), then:
#
#   docker compose run --rm validate
#   LOKO_UID=$(id -u) LOKO_GID=$(id -g) docker compose run --rm build
#   docker compose up serve
#
# The image runs as uid 65532. `build` runs as your user so the files it writes
# to the mounted directory are yours.

x-loko: &loko
  image: ghcr.io/madstone-tech/loko:latest
  volumes:
    - ${LOKO_PROJECT:-.}:/workspace

services:
  validate:
    <<: *loko
    command: ["validate", "--strict"]

  build:
    <<: *loko
    user: "${LOKO_UID:-1000}:${LOKO_GID:-1000}"
    command: ["build", "--out", "dist"]

  # Inside the container, serve binds every interface so the published port
  # reaches it (loko prints a warning saying so). The port is published on the
  # host's loopback only, so the site stays private to this machine. Open
  # http://127.0.0.1:8080; it rebuilds on every change.
  serve:
    <<: *loko
    ports:
      - "127.0.0.1:8080:8080"
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
