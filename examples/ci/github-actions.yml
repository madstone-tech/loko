# Validate a loko architecture and build its site.
#
# Copy to .github/workflows/architecture.yml in your repository and set
# LOKO_PROJECT to the directory holding your *.loko.hcl files.

name: Architecture

on:
  pull_request:
    paths:
      - "**/*.loko.hcl"
      - "**/*.md"
  push:
    branches: [main]

env:
  LOKO_PROJECT: architecture

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install loko
        run: go install github.com/madstone-tech/loko@latest

      # --strict: warnings (missing docs, orphans, unbound instances...) fail the run.
      # Exit codes: 0 clean, 1 errors, 2 warnings.
      - name: Validate
        run: loko validate --strict -p "$LOKO_PROJECT"

      - name: Check formatting
        run: loko fmt --check -p "$LOKO_PROJECT"

      - name: Build site
        run: loko build -p "$LOKO_PROJECT" --out site

      - uses: actions/upload-artifact@v7
        with:
          name: architecture-site
          path: site
          retention-days: 14

  # Same checks without installing Go, using the release image.
  # The image runs as uid 65532, so it writes to a directory it owns.
  check-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate and build
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/madstone-tech/loko:latest \
            validate --strict -p "$LOKO_PROJECT"
          docker run --rm -v "$PWD:/workspace" ghcr.io/madstone-tech/loko:latest \
            fmt --check -p "$LOKO_PROJECT"
          docker run --rm -v "$PWD:/workspace" --user "$(id -u):$(id -g)" \
            ghcr.io/madstone-tech/loko:latest build -p "$LOKO_PROJECT" --out site
