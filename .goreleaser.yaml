# GoReleaser configuration for loko
# https://goreleaser.com/customization/
#
# Validate:        goreleaser check
# Local snapshot:  goreleaser release --snapshot --clean   (nothing is published)

version: 2

project_name: loko

before:
  hooks:
    - go mod tidy

builds:
  - id: loko
    binary: loko
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
      - -X main.builtBy=goreleaser
    # Reproducible builds: file times and the embedded date come from the
    # commit, not from the machine that ran the release.
    mod_timestamp: "{{ .CommitTimestamp }}"

# One macOS binary for Intel and Apple silicon.
universal_binaries:
  - id: loko_universal
    ids: [loko]
    replace: true
    name_template: loko
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "all" }}universal
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - "^style"
      - "^Merge"
  groups:
    - title: New Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: madstone-tech
    name: loko
  prerelease: auto
  mode: replace
  header: |
    ## 🪇 loko {{ .Tag }}

    loko compiles a C4 software architecture from HCL into diagrams, markdown, a site, queries
    and an MCP server for assistants. See the [changelog](https://github.com/madstone-tech/loko/blob/{{ .Tag }}/CHANGELOG.md).

    ### Install

    ```bash
    # Homebrew (macOS and Linux)
    brew install --cask madstone-tech/tap/loko

    # Go
    go install github.com/madstone-tech/loko@{{ .Tag }}

    # Docker
    docker run --rm -v "$PWD:/workspace" ghcr.io/madstone-tech/loko:{{ .Tag }} build
    ```

    Or download an archive below and put `loko` on your `PATH`. Verify with `loko --version`.
  footer: |
    **Full Changelog**: https://github.com/madstone-tech/loko/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---
    *🪇 "Papa Loko, you're the wind, pushing us, and we become butterflies."*

# Homebrew: a cask in madstone-tech/homebrew-tap (casks replaced formulae for
# pre-built binaries in GoReleaser v2.10).
homebrew_casks:
  - name: loko
    repository:
      owner: madstone-tech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/madstone-tech/loko
    description: Compile C4 software architecture from HCL into diagrams, docs and queries
    license: BUSL-1.1
    binaries: [loko]
    commit_msg_template: "chore(loko): {{ .Tag }}"
    # Generated from the binary itself, so completions always match the release.
    generate_completions_from_executable:
      args: [completion]
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    hooks:
      post:
        # The binary is not notarized; without this, Gatekeeper blocks it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/loko"]
          end

# Multi-platform image on GHCR: one buildx build for every platform, pushed
# as a single manifest list (replaces dockers + docker_manifests).
# CI needs docker/setup-buildx-action and a GHCR login before GoReleaser.
dockers_v2:
  - id: loko
    ids: [loko]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/madstone-tech/loko
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Compile C4 software architecture from HCL
      org.opencontainers.image.url: https://github.com/madstone-tech/loko
      org.opencontainers.image.source: https://github.com/madstone-tech/loko
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: BUSL-1.1
    sbom: true

# Transient failures (GitHub API, registry) are retried.
retry:
  attempts: 5
  delay: 5s
  max_delay: 1m

announce:
  skip: true
