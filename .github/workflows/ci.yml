name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Go mod tidy
        run: go mod tidy

      - name: Go mod verify
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  # SC-002 (feature 014): rendered output is byte-identical across runs,
  # discovery orders and operating systems. The goldens committed from one OS
  # must match what the other renders.
  determinism:
    name: Determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build determinism and notices
        run: go test ./cmd/ -run 'TestBuild(Deterministic|Notice)' -count=1

      - name: Discovery-order determinism
        run: go test ./internal/adapters/hclsource/ -run TestRenderDeterministicDiscoveryOrder -count=1

      - name: Backend goldens
        run: go test ./internal/adapters/d2/ ./internal/adapters/markdown/ ./internal/adapters/html/ -count=1

      # SC-006 wall-clock budgets. The 2 s edit-to-browser budget is enforced
      # here; the 10 s full-build budget is a developer-hardware bound, so on
      # CI (CI=true) its time is logged, not failed (research R2). Race-free
      # on purpose: the -race job skips or relaxes timings (cmd/race_on_test.go).
      - name: Performance budgets
        run: go test ./cmd/ -run 'TestPerformance(Build|WideView)|TestServe$' -count=1 -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: go build -v .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

  constitution:
    name: Constitution Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run constitution audit (archcheck)
        run: go run ./tools/archcheck --format=json --report=archcheck-report.json

      - name: Upload archcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archcheck-report
          path: archcheck-report.json
          retention-days: 14

  examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build loko
        run: go build -o loko .

      - name: Validate simple-project example
        run: |
          cd examples/simple-project
          # Verify project structure
          test -f loko.toml
          test -f src/api-service/system.md
          test -f src/api-service/system.d2
          echo "simple-project structure valid"

      - name: Validate 3layer-app example
        run: |
          cd examples/3layer-app
          # Verify project structure
          test -f loko.toml
          test -f src/frontend/system.md
          test -f src/backend/system.md
          test -f src/database/system.md
          echo "3layer-app structure valid"

      - name: Validate microservices example
        run: |
          cd examples/microservices
          # Verify project structure
          test -f loko.toml
          test -f src/api-gateway/system.md
          test -f src/user-service/system.md
          test -f src/order-service/system.md
          test -f src/notification-service/system.md
          echo "microservices structure valid"

      - name: Test loko validate on examples
        run: |
          # Run loko validate on each example (non-blocking for now)
          ./loko validate --project examples/simple-project || true
          ./loko validate --project examples/3layer-app || true
          ./loko validate --project examples/microservices || true
          echo "Validation completed"
