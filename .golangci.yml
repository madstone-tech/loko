# golangci-lint configuration (v2)
version: "2"

run:
  timeout: 5m
  go: "1.27"
  tests: false

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - depguard
  disable:
    - exhaustive
    - exhaustruct
    - varnamelen
    - revive
  settings:
    # Depguard is the redundant fast-path layer-import check (IDE + `task lint`).
    # The full rule set lives in `tools/archcheck/rules.yaml` and is enforced
    # authoritatively by `task audit-constitution` (tools/archcheck). Here we
    # encode the highest-leverage rules so contributors get editor-time
    # feedback on the most-frequently-regressed boundaries:
    #   - cmd/ MUST NOT import internal/core/entities directly (Constitution v1.1.0+).
    #
    # TODO(011-mcp-entity-decoupling): once the suppressed files in
    # .archcheck-suppressions.yaml are refactored to obtain entity types via
    # use-case return values, ADD parallel rules here:
    #   - mcp-no-direct-entities (files: "internal/mcp/**/*.go")
    #   - api-no-direct-entities (files: "internal/api/**/*.go")
    # That mirrors Constitution v1.2.0 in the fast-path. Today these rules are
    # intentionally absent: depguard has no per-file suppression mechanism
    # equivalent to archcheck's, so enabling them now would break `task lint`
    # on 20 files that are knowingly suppressed in archcheck pending feature 011.
    depguard:
      rules:
        cmd-no-direct-entities:
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
          deny:
            - pkg: "github.com/madstone-tech/loko/internal/core/entities"
              desc: >-
                cmd/ MUST NOT import entities directly under constitution
                v1.1.0+; obtain entity types via use-case return values or
                adapter outputs. See .specify/memory/constitution.md and
                tools/archcheck/rules.yaml.

        # FR-044 (feature 013-hcl-compiler-core): the HCL, cty, and d2 libraries
        # are confined to internal/adapters/** so the compiler core stays free of
        # its parsing and rendering dependencies. Unlike the mcp/api entity rules
        # above, these CAN be enabled today: nothing outside adapters imports them,
        # so there is nothing to suppress and `task lint` stays green.
        core-no-parser-or-renderer:
          list-mode: lax
          files:
            - "**/internal/core/**/*.go"
          deny: &deny-parser-renderer
            - pkg: "github.com/hashicorp/hcl"
              desc: >-
                HCL is confined to internal/adapters/hclsource; core must not
                see hcl.Range or hcl.Body. Ranges cross the boundary as
                entities.SourceRange (FR-044).
            - pkg: "github.com/zclconf/go-cty"
              desc: >-
                cty is confined to internal/adapters/hclsource; core must not
                see cty.Value. Scalars cross the boundary as entities.Value
                (FR-044).
            - pkg: "oss.terrastruct.com/d2"
              desc: >-
                d2 is confined to internal/adapters/d2; core renders nothing
                and must not depend on a diagram library (FR-044).
            - pkg: "github.com/yuin/goldmark"
              desc: >-
                goldmark is confined to internal/adapters/html; prose is
                converted by the html backend only (feature 014, research R15).
            - pkg: "os/exec"
              desc: >-
                No layer may start a process: rendering is in-process and loko
                ships as a single binary (FR-014, feature 014).

        outer-no-parser-or-renderer:
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/mcp/**/*.go"
            - "**/internal/api/**/*.go"
          deny: *deny-parser-renderer

        # R15 (feature 014-viewmodel-renderers): adapters may use d2 and
        # goldmark, but none may start a process (FR-014).
        adapters-no-exec:
          list-mode: lax
          files:
            - "**/internal/adapters/**/*.go"
          deny:
            - pkg: "os/exec"
              desc: >-
                Rendering is in-process; the exec-based d2 renderer was removed
                in feature 014 (FR-014).

        # FR-041 (feature 014-viewmodel-renderers): no output backend is
        # reachable from the conversational interface.
        mcp-no-render-backends:
          list-mode: lax
          files:
            - "**/internal/mcp/**/*.go"
          deny:
            - pkg: "github.com/madstone-tech/loko/internal/adapters/d2"
              desc: "Build artifacts are produced by `loko build` only (FR-041)."
            - pkg: "github.com/madstone-tech/loko/internal/adapters/html"
              desc: "Build artifacts are produced by `loko build` only (FR-041)."
            - pkg: "github.com/madstone-tech/loko/internal/adapters/markdown"
              desc: "Build artifacts are produced by `loko build` only (FR-041)."
            - pkg: "github.com/madstone-tech/loko/internal/adapters/outputdir"
              desc: "Build artifacts are produced by `loko build` only (FR-041)."
            - pkg: "github.com/madstone-tech/loko/internal/adapters/devserver"
              desc: "Build artifacts are produced by `loko build` only (FR-041)."

formatters:
  enable:
    - gofmt
